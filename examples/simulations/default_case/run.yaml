references:
  chemistry_file: chemistry.yaml
  program_file: program.yaml
  solids_file: solids.yaml
simulation:
  system_name: DefaultCase
  time_horizon_s: 1000.0
  reporting_interval_s: 1.0
  repeat_program: true
  interior_flow_mode: forward_only
  mass_scheme: weno3
  heat_scheme: weno3
  report_time_derivatives: false
model:
  bed_length_m: 6.0
  bed_radius_m: 0.5
  axial_cells: 20
  # bed_only: e_b; bed_and_particle: e_b + (1-e_b)*e_p (default).
  gas_voidage_mode: bed_and_particle
  ambient_temperature_k: 873.15
  heat_transfer_coefficient_w_per_m2_k: 0.0
solver:
  backend: compiled
  name: band
  threads: 1
  relative_tolerance: 1.0e-7
  concentration_absolute_tolerance: 1.0e-11
  suppress_algebraic_errors: false
  max_nonlinear_iterations: 20
  nonlinear_convergence_coefficient: 0.1
  maximum_order: 3
  scale_residuals: true
  step_growth_threshold: 1.25
  nonlinear_refresh_interval: 4
  vector_exponentials: false
  band_reciprocals: false
outputs:
  directory: output
  artifacts_directory: output/artifacts
  requested_plots:
    - axial_profiles
    - outlet_composition
    - outlet_conditions
  requested_reports:
    - temperature
    - pressure
    - gas_mole_fraction
    - gas_flux
    - solid_mole_fraction
    - heat_balance
    - mass_balance
