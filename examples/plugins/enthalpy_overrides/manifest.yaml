id: example_enthalpy_overrides
name: Example enthalpy overrides
description: CO2 and H2O variants sharing one new logarithmic enthalpy correlation.
source: Illustrative API example; coefficients are not validated scientific data.
species:
  CO2:
    name: Carbon Dioxide
    chemical_key: CO2
    phase: gas
    mw: 0.0440095
    enthalpy:
      model: logarithmic
      parameters:
        cp_inf: 65.0
        deficit: 28.0
        t_ref: 298.15
        h_ref: -393505.0
    viscosity:
      model: builtin:quadratic_viscosity
      parameters:
        t_ref: 1000.0
        a0: 3.99550354e-05
        a1: 2.79482484e-08
        a2: -8.23314636e-12
    source: Built-in molecular weight and viscosity; illustrative plugin Cp/enthalpy
    notes: Replaces only enthalpy/Cp; molecular weight and viscosity match the built-in.
      Choose Use this as replacement to apply it.
  H2O:
    name: Water
    chemical_key: H2O
    phase: gas
    mw: 0.01801528
    enthalpy:
      model: logarithmic
      parameters:
        cp_inf: 55.0
        deficit: 21.0
        t_ref: 298.15
        h_ref: -241826.0
    viscosity:
      model: builtin:quadratic_viscosity
      parameters:
        t_ref: 1000.0
        a0: 3.7737102e-05
        a1: 4.16760701e-08
        a2: 1.73653811e-12
    source: Built-in molecular weight and viscosity; illustrative plugin Cp/enthalpy
    notes: Replaces only enthalpy/Cp; molecular weight and viscosity match the built-in.
      Choose Use this as replacement to apply it.
correlations:
  logarithmic:
    kind: enthalpy
    implementation: correlation:create
    parameters:
      cp_inf:
        default: 50.0
        unit: J/(mol*K)
        description: High-temperature Cp
        minimum: 1.0
      deficit:
        default: 15.0
        unit: J/(mol*K)
        description: Cp deficit at Tref
        minimum: 0.0
      t_ref:
        default: 298.15
        unit: K
        description: Reference temperature
        minimum: 1.0
      h_ref:
        default: 0.0
        unit: J/mol
        description: Enthalpy at Tref
    name: Logarithmic enthalpy
