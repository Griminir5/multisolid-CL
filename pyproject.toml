[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "multisolid-cl"
version = "0.2.0"
description = "DAETools packed-bed reactor simulation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = ["numpy", "scipy", "xarray", "pydantic>=2", "PyYAML", "matplotlib"]

[project.optional-dependencies]
plotter = ["PyQt6", "PyQt6-WebEngine"]
compiled = ["scikit-sundae==1.1.3", "filelock==3.20.0"]

[project.scripts]
packed-bed = "packed_bed.cli:main"

[tool.setuptools.packages.find]
include = ["packed_bed*"]
namespaces = false

[tool.setuptools.package-data]
packed_bed = [
    "compiled/*.cpp",
    "compiled/*.hpp",
    "compiled/licenses/*",
    "kinetics/*.md",
]
