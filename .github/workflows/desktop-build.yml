name: Check application
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.label }} application
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-24.04
            python: '3.12'
            platform: linux
          - label: Windows
            # The installer requires the Windows 11-era kernel (build 22000+).
            os: windows-2025
            python: '3.11.9'
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install help build tools
        run: python -m pip install --require-hashes -r tools/help-requirements.txt
      - name: Test help checks on Linux and Windows checkouts
        run: python -m unittest discover -s tests -p test_help_build.py -v
      - name: Check offline help is up to date
        run: python tools/build_help.py --check
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran cmake binutils graphviz fonts-dejavu-core desktop-file-utils libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libgl1 libegl1 libfontconfig1 libdbus-1-3 xvfb xauth
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libgomp mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Build Linux, run the example, and check the desktop
        if: runner.os == 'Linux'
        run: python -u tools/build_desktop.py --headless
      - name: Build Windows, run the example, and check the desktop
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: '"$(cygpath -u "$pythonLocation")/python.exe" -u tools/build_desktop.py'
      - name: Check Linux installer, portable archive, and uninstall
        if: runner.os == 'Linux'
        run: xvfb-run -a build/release-linux/venv/bin/python tools/check_installers.py --downloads dist/linux/releases --bundle dist/linux/MultiSolid --output build/release-linux/installer-check --system --qt-platform xcb
      - name: Check Windows installer, portable ZIP, and uninstall
        if: runner.os == 'Windows'
        run: build/release-windows/venv/Scripts/python.exe tools/check_installers.py --downloads dist/windows/releases --bundle dist/windows/MultiSolid --output build/release-windows/installer-check
      - name: Save installer and portable downloads
        uses: actions/upload-artifact@v4
        with:
          name: MultiSolid-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/releases/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Save check results and logs, including failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-results-${{ matrix.platform }}
          path: |
            build/release-${{ matrix.platform }}/example-check/run-*/result.json
            build/release-${{ matrix.platform }}/example-check/run-*/simulation.log
            build/release-${{ matrix.platform }}/example-check/run-*/case/*.yaml
            build/release-${{ matrix.platform }}/example-check/run-*/case/output/
            build/release-${{ matrix.platform }}/acceptance-*/check/**/*.json
            build/release-${{ matrix.platform }}/acceptance-*/check/**/*.log
            build/release-${{ matrix.platform }}/installer-check/*.json
            build/release-${{ matrix.platform }}/installer-check/*.log
            build/release-${{ matrix.platform }}/installer-check/installed-check/**/*.json
            build/release-${{ matrix.platform }}/installer-check/installed-check/**/*.log
            build/release-${{ matrix.platform }}/inno-setup.log
          retention-days: 14
      - name: Explain the result
        if: always()
        shell: python
        env:
          CHECK_STATUS: ${{ job.status }}
          CHECK_PLATFORM: ${{ matrix.label }}
        run: |
          import os
          from pathlib import Path
          status = os.environ['CHECK_STATUS']
          platform = os.environ['CHECK_PLATFORM']
          message = (f'{platform}: passed. The application built, the full reacting example passed, '
                     'and the desktop, installer, portable download, and uninstall checks passed. '
                     'Download the installer or portable application from Artifacts below.'
                     if status == 'success' else
                     f'{platform}: {status}. Open the failed step above for the error. '
                     'Available simulation and desktop logs are saved in the check-results artifact below.')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(message + '\n')

  release:
    name: Prepare draft release with all four downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Get the release tools
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download both platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: MultiSolid-*
          path: build/release-artifacts
      - name: Verify all four downloads and combine checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/prepare_release_assets.py --artifacts build/release-artifacts --output build/release-downloads --tag "$RELEASE_TAG"
      - name: Create or update the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > build/release-is-draft.txt; then
            if [ "$(cat build/release-is-draft.txt)" != true ]; then
              echo "This release is already published. Create a new version instead of replacing its downloads."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" build/release-downloads/* --clobber
          else
            gh release create "$RELEASE_TAG" build/release-downloads/* --draft --verify-tag --title "MultiSolid ${RELEASE_TAG#v}" --notes-file build/release-notes.md
          fi
