name: Desktop build
on:
  workflow_dispatch:
  pull_request:
    paths: ['tools/**', 'desktop/pyproject.toml', 'pyproject.toml', 'tests/test_packaging.py', '.github/workflows/desktop-build.yml']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
            platform: linux
          - os: windows-2022
            python: '3.11.9'
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Packaging regression tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_packaging.py -q
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran cmake binutils graphviz fonts-dejavu-core libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libgl1 libegl1 libfontconfig1 libdbus-1-3 xvfb xauth
          python tools/build_desktop.py --headless
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libgomp mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: '"$(cygpath -u "$pythonLocation")/python.exe" tools/build_desktop.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}/releases/
            build/release-${{ matrix.platform }}/acceptance-*/check/validation.json
            build/release-${{ matrix.platform }}/acceptance-*/check/launcher.log
            build/release-${{ matrix.platform }}/acceptance-*/check/self-test/result.json
