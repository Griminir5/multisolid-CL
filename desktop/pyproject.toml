[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multisolid-cl-ui"
version = "1.0.0"
description = "A small desktop application for MultiSolid packed-bed simulations"
readme = {content-type = "text/markdown", text = """
# MultiSolid desktop

Desktop application for MultiSolid-CL packed-bed simulations, with project and
case editors, parameter studies, plots, and Excel reports.

See the [repository documentation](https://github.com/Griminir5/multisolid-CL#documentation)
for usage, installation, and development.
"""}
requires-python = ">=3.11,<3.13"
license = "GPL-3.0-only"
dependencies = ["multisolid-cl[compiled]==1.0.0", "PyQt6", "matplotlib", "openpyxl>=3.1,<4"]

[project.gui-scripts]
packed-bed-ui = "packed_bed_ui.__main__:main"

[tool.setuptools.packages.find]
include = ["packed_bed_ui*"]
namespaces = false

[tool.setuptools.package-data]
packed_bed_ui = ["_build_identity.json", "assets/*.svg", "assets/fonts/*", "assets/help/*"]
